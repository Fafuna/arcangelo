  <script>
  (function() {
    'use strict';

    // === Load Data ===
    var games = JSON.parse(localStorage.getItem('games') || '[]');
    var gameVideos = JSON.parse(localStorage.getItem('game-videos') || '{}');
    var videoStats = JSON.parse(localStorage.getItem('video-stats') || '{}');

    // Game lookup map
    var gameMap = {};
    games.forEach(function(g) { gameMap[g.id] = g; });

    // Build flat video list
    function buildVideoList() {
      var list = [];
      Object.keys(gameVideos).forEach(function(gameId) {
        var gid = parseInt(gameId);
        var g = gameMap[gid];
        gameVideos[gameId].forEach(function(v, idx) {
          var key = gid + '_' + idx;
          var stats = videoStats[key] || {};
          list.push({
            key: key,
            gameId: gid,
            game: g,
            video: v,
            videoIdx: idx,
            views: stats.views || 0,
            likes: stats.likes || 0,
            comments: stats.comments || 0,
            shares: stats.shares || 0,
            note: stats.note || ''
          });
        });
      });
      return list;
    }

    var allVideos = buildVideoList();

    // === Helpers ===
    function fmtNum(n) {
      if (!n) return '0';
      if (n >= 10000) return (n / 10000).toFixed(1) + 'w';
      if (n >= 1000) return (n / 1000).toFixed(1) + 'k';
      return n.toString();
    }
    function fmtFullNum(n) {
      if (!n) return '0';
      return n.toLocaleString();
    }
    function calcRate(views, likes) {
      if (!views || !likes) return '0.0%';
      return ((likes / views) * 100).toFixed(1) + '%';
    }
    function getRateClass(rateStr) {
      var v = parseFloat(rateStr);
      if (v >= 5) return 'high';
      if (v >= 2) return 'mid';
      return 'low';
    }
    function getCoverUrl(g) {
      if (!g) return null;
      if (g.coverUrl) return g.coverUrl;
      if (g.officialUrl && g.officialUrl.indexOf('store.steampowered.com/app/') !== -1) {
        var match = g.officialUrl.match(/app\/(\d+)/);
        if (match) return 'https://cdn.akamai.steamstatic.com/steam/apps/' + match[1] + '/capsule_616x353.jpg';
      }
      return null;
    }

    // === Render Stats ===
    function renderStats() {
      var totalVideos = allVideos.length;
      var totalViews = 0, totalLikes = 0, totalComments = 0, totalShares = 0;
      allVideos.forEach(function(v) {
        totalViews += v.views || 0;
        totalLikes += v.likes || 0;
        totalComments += v.comments || 0;
        totalShares += v.shares || 0;
      });
      var avgRate = totalViews ? ((totalLikes / totalViews) * 100).toFixed(1) + '%' : '0.0%';

      var html = '';
      html += '<div class="stat-tile"><div class="stat-tile-header"><span class="icon">&#127909;</span>视频总数</div><div class="stat-tile-value">' + totalVideos + '</div></div>';
      html += '<div class="stat-tile"><div class="stat-tile-header"><span class="icon">&#128064;</span>总播放量</div><div class="stat-tile-value">' + fmtNum(totalViews) + '</div></div>';
      html += '<div class="stat-tile"><div class="stat-tile-header"><span class="icon">&#128077;</span>总点赞</div><div class="stat-tile-value">' + fmtNum(totalLikes) + '</div></div>';
      html += '<div class="stat-tile"><div class="stat-tile-header"><span class="icon">&#128172;</span>总评论</div><div class="stat-tile-value">' + fmtNum(totalComments) + '</div></div>';
      html += '<div class="stat-tile"><div class="stat-tile-header"><span class="icon">&#128260;</span>总分享</div><div class="stat-tile-value">' + fmtNum(totalShares) + '</div></div>';
      html += '<div class="stat-tile"><div class="stat-tile-header"><span class="icon">&#128200;</span>平均点赞率</div><div class="stat-tile-value">' + avgRate + '</div></div>';
      document.getElementById('stats-grid').innerHTML = html;
    }

    // === Render Platform Chart ===
    function renderPlatformChart() {
      var platCounts = {};
      allVideos.forEach(function(v) {
        var p = v.video.platform || '其他';
        platCounts[p] = (platCounts[p] || 0) + 1;
      });
      var labels = Object.keys(platCounts);
      if (labels.length === 0) {
        document.getElementById('platform-chart').innerHTML = '<div class="empty-state"><p>暂无视频数据</p></div>';
        return;
      }
      var maxCount = Math.max.apply(null, Object.values(platCounts));
      var colors = {
        'B站': '#00a1d6',
        'YouTube': '#ff0000',
        '抖音': '#000000',
        '小红书': '#ff2442',
        '其他': '#6c5ce7'
      };
      var html = '';
      labels.forEach(function(label) {
        var count = platCounts[label];
        var pct = (count / maxCount * 100);
        var color = colors[label] || '#6c5ce7';
        html += '<div class="bar-item">' +
          '<div class="bar-value">' + count + '</div>' +
          '<div class="bar-fill" style="height:' + Math.max(pct, 4) + 'px;background:' + color + ';"></div>' +
          '<div class="bar-label">' + label + '</div>' +
        '</div>';
      });
      document.getElementById('platform-chart').innerHTML = html;
    }

    // === Render Table ===
    var editingKey = null;
    function renderTable() {
      if (allVideos.length === 0) {
        document.getElementById('table-view').innerHTML =
          '<div class="empty-state">' +
            '<div class="icon">&#127909;</div>' +
            '<p>还没有产出视频，<a href="game-topic-dashboard.html">去游戏列表添加</a></p>' +
          '</div>';
        return;
      }

      var html = '<table class="video-table">' +
        '<thead><tr>' +
          '<th>游戏</th>' +
          '<th>平台</th>' +
          '<th>视频链接</th>' +
          '<th style="text-align:right">播放量</th>' +
          '<th style="text-align:right">点赞</th>' +
          '<th style="text-align:right">评论</th>' +
          '<th style="text-align:right">分享</th>' +
          '<th style="text-align:right">点赞率</th>' +
          '<th style="text-align:center">操作</th>' +
        '</tr></thead><tbody>';

      allVideos.forEach(function(item) {
        var g = item.game;
        var v = item.video;
        var cover = getCoverUrl(g);
        var emoji = g && g.emoji ? g.emoji : (g && g.genres && g.genres[0] ? {'动作':'&#128074;','射击':'&#128299;','RPG':'&#9876;','策略':'&#127942;','冒险':'&#127965;','模拟':'&#128300;','体育':'&#9917;','赛车':'&#127950;','格斗':'&#129354;','恐怖':'&#128123;','解谜':'&#128161;','视觉小说':'&#128220;'}[g.genres[0]] : '&#127918;') : '&#127918;';
        var gameName = g ? g.name : '未知游戏';
        var gameDate = g ? g.date : '-';
        var rate = calcRate(item.views, item.likes);
        var rateClass = getRateClass(rate);
        var stat = videoStats[item.key] || {};
        var syncBadge = stat.syncedAt ? '<span style="font-size:0.65rem;color:var(--accent2);margin-left:0.3rem;" title="同步于 ' + new Date(stat.syncedAt).toLocaleString('zh-CN') + '">&#128260;</span>' : '';

        if (editingKey === item.key) {
          html += '<tr data-key="' + item.key + '">' +
            '<td><div class="td-game">' +
              (cover ? '<img src="' + cover + '" class="td-game-img" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\';">' : '') +
              '<div class="td-game-img fallback"' + (cover ? ' style="display:none"' : '') + '>' + emoji + '</div>' +
              '<div class="td-game-info"><div class="td-game-name">' + gameName + '</div><div class="td-game-meta">' + gameDate + '</div></div>' +
            '</div></td>' +
            '<td><span class="td-platform">' + v.platform + '</span></td>' +
            '<td class="td-link"><a href="' + v.url + '" target="_blank" rel="noopener">' + (v.title || '视频链接') + '</a></td>' +
            '<td style="text-align:right"><input type="number" class="edit-input" id="edit-views-' + item.key + '" value="' + (item.views || 0) + '" min="0"></td>' +
            '<td style="text-align:right"><input type="number" class="edit-input" id="edit-likes-' + item.key + '" value="' + (item.likes || 0) + '" min="0"></td>' +
            '<td style="text-align:right"><input type="number" class="edit-input" id="edit-comments-' + item.key + '" value="' + (item.comments || 0) + '" min="0"></td>' +
            '<td style="text-align:right"><input type="number" class="edit-input" id="edit-shares-' + item.key + '" value="' + (item.shares || 0) + '" min="0"></td>' +
            '<td style="text-align:right" class="td-rate ' + rateClass + '">' + rate + '</td>' +
            '<td style="text-align:center"><button class="btn-save-row" onclick="saveRow(\'' + item.key + '\')">保存</button><button class="btn-cancel-row" onclick="cancelEdit()">取消</button></td>' +
          '</tr>';
        } else {
          html += '<tr data-key="' + item.key + '">' +
            '<td><div class="td-game">' +
              (cover ? '<img src="' + cover + '" class="td-game-img" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\';">' : '') +
              '<div class="td-game-img fallback"' + (cover ? ' style="display:none"' : '') + '>' + emoji + '</div>' +
              '<div class="td-game-info"><div class="td-game-name">' + gameName + syncBadge + '</div><div class="td-game-meta">' + gameDate + '</div></div>' +
            '</div></td>' +
            '<td><span class="td-platform">' + v.platform + '</span></td>' +
            '<td class="td-link"><a href="' + v.url + '" target="_blank" rel="noopener">' + (v.title || '视频链接') + '</a></td>' +
            '<td style="text-align:right" class="td-number">' + fmtFullNum(item.views) + '</td>' +
            '<td style="text-align:right" class="td-number">' + fmtFullNum(item.likes) + '</td>' +
            '<td style="text-align:right" class="td-number">' + fmtFullNum(item.comments) + '</td>' +
            '<td style="text-align:right" class="td-number">' + fmtFullNum(item.shares) + '</td>' +
            '<td style="text-align:right" class="td-rate ' + rateClass + '">' + rate + '</td>' +
            '<td style="text-align:center"><button class="btn-edit" onclick="startEdit(\'' + item.key + '\')" title="编辑数据">&#9998;</button></td>' +
          '</tr>';
        }
      });

      html += '</tbody></table>';
      document.getElementById('table-view').innerHTML = html;
    }

    // === Edit Actions ===
    window.startEdit = function(key) {
      editingKey = key;
      renderTable();
      // Focus first input
      setTimeout(function() {
        var input = document.getElementById('edit-views-' + key);
        if (input) input.focus();
      }, 50);
    };
    window.cancelEdit = function() {
      editingKey = null;
      renderTable();
    };
    window.saveRow = function(key) {
      var views = parseInt(document.getElementById('edit-views-' + key).value) || 0;
      var likes = parseInt(document.getElementById('edit-likes-' + key).value) || 0;
      var comments = parseInt(document.getElementById('edit-comments-' + key).value) || 0;
      var shares = parseInt(document.getElementById('edit-shares-' + key).value) || 0;

      videoStats[key] = {
        views: views,
        likes: likes,
        comments: comments,
        shares: shares,
        updatedAt: new Date().toISOString()
      };
      localStorage.setItem('video-stats', JSON.stringify(videoStats));

      // Update local array
      var item = allVideos.find(function(v) { return v.key === key; });
      if (item) {
        item.views = views;
        item.likes = likes;
        item.comments = comments;
        item.shares = shares;
      }

      editingKey = null;
      renderTable();
      renderStats();
      renderPlatformChart();
      showToast('数据已保存');
    };

    // === Toast ===
    function showToast(message) {
      var container = document.getElementById('toast-container');
      var toast = document.createElement('div');
      toast.className = 'toast';
      toast.innerHTML = '<span class="toast-icon">&#9989;</span>' + message;
      container.appendChild(toast);
      requestAnimationFrame(function() { toast.classList.add('show'); });
      setTimeout(function() {
        toast.classList.remove('show');
        setTimeout(function() { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 350);
      }, 2200);
    }

    // === Switch View ===
    window.switchView = function(view) {
      document.querySelectorAll('.section-actions .btn-sm').forEach(function(b) { b.classList.remove('active'); });
      event.target.classList.add('active');
      renderTable();
    };

    // === B站 BV号提取 ===
    function extractBvid(url) {
      var match = url.match(/\/video\/(BV[\w]+)/);
      if (match) return match[1];
      match = url.match(/bvid=(BV[\w]+)/);
      if (match) return match[1];
      match = url.match(/(BV[\w]{10})/);
      if (match) return match[1];
      return null;
    }

    // === 通过JSONP获取B站视频数据 (绕过CORS) ===
    var jsonpCounter = 0;
    function fetchBiliStats(bvid, callback) {
      var cbName = '__bili_cb_' + (++jsonpCounter);
      var script = document.createElement('script');
      var timeout = setTimeout(function() {
        cleanup();
        callback(null, 'timeout');
      }, 10000);

      function cleanup() {
        clearTimeout(timeout);
        if (window[cbName]) { try { delete window[cbName]; } catch(e) { window[cbName] = undefined; } }
        if (script.parentNode) script.parentNode.removeChild(script);
      }

      window[cbName] = function(data) {
        cleanup();
        callback(data, null);
      };

      // B站stat接口支持callback参数 (JSONP)
      script.src = 'https://api.bilibili.com/x/web-interface/archive/stat?bvid=' + bvid + '&callback=' + cbName;
      script.onerror = function() {
        cleanup();
        callback(null, 'network_error');
      };
      document.head.appendChild(script);
    }

    // === 同步所有B站视频数据 ===
    window.syncAllStats = function() {
      var biliVideos = allVideos.filter(function(v) { return v.video.platform === 'B站'; });
      if (biliVideos.length === 0) {
        showToast('没有B站视频可同步');
        return;
      }

      var btn = document.getElementById('sync-btn');
      var statusEl = document.getElementById('sync-status');
      btn.disabled = true;
      btn.textContent = '同步中...';
      statusEl.style.display = 'block';
      statusEl.textContent = '正在获取B站视频数据...';

      var completed = 0;
      var success = 0;
      var failed = 0;
      var total = biliVideos.length;

      biliVideos.forEach(function(item) {
        var bvid = extractBvid(item.video.url);
        if (!bvid) {
          completed++;
          failed++;
          checkDone();
          return;
        }

        fetchBiliStats(bvid, function(data, err) {
          completed++;
          if (err || !data || data.code !== 0) {
            failed++;
          } else {
            var stat = data.data;
            videoStats[item.key] = {
              views: stat.view || 0,
              likes: stat.like || 0,
              comments: stat.reply || 0,
              shares: stat.share || 0,
              coins: stat.coin || 0,
              favorites: stat.favorite || 0,
              danmaku: stat.danmaku || 0,
              syncedAt: new Date().toISOString()
            };
            // Update local item
            item.views = stat.view || 0;
            item.likes = stat.like || 0;
            item.comments = stat.reply || 0;
            item.shares = stat.share || 0;
            success++;
          }
          checkDone();
        });
      });

      function checkDone() {
        statusEl.textContent = '正在同步... (' + completed + '/' + total + ')';
        if (completed >= total) {
          localStorage.setItem('video-stats', JSON.stringify(videoStats));
          renderTable();
          renderStats();
          renderPlatformChart();
          btn.disabled = false;
          btn.innerHTML = '&#128260; 同步B站数据';
          if (success > 0) {
            statusEl.innerHTML = '&#9989; 同步完成: 成功 ' + success + ' 个' + (failed > 0 ? ', 失败 ' + failed + ' 个' : '') + ' · ' + new Date().toLocaleTimeString('zh-CN');
            showToast('已同步 ' + success + ' 个视频数据');
          } else {
            statusEl.innerHTML = '&#9888; 同步失败: 浏览器跨域限制无法直接获取B站数据。请使用油猴脚本或手动填写数据。';
            showToast('同步失败，请手动填写');
          }
        }
      }
    };

    // === Init ===
    renderStats();
    renderPlatformChart();
    renderTable();
  })();
  </script>
</body>
</html>
