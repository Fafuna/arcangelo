        var matchGenre = currentGenre === 'all' || g.genres.some(function(genre) {
          return genre.toLowerCase().indexOf(currentGenre.toLowerCase()) !== -1 ||
                 currentGenre.toLowerCase().indexOf(genre.toLowerCase()) !== -1;
        });
        var q = searchQuery.toLowerCase();
        var matchSearch = !q ||
          g.name.toLowerCase().indexOf(q) !== -1 ||
          g.nameEn.toLowerCase().indexOf(q) !== -1 ||
          (g.developer && g.developer.toLowerCase().indexOf(q) !== -1) ||
          g.genres.some(function(genre) { return genre.toLowerCase().indexOf(q) !== -1; }) ||
          g.desc.toLowerCase().indexOf(q) !== -1;
        var matchStat = true;
        if (statFilter === 'month') {
          var now = new Date();
          var dateStr = g.date.substring(0, 10);
          var d = new Date(dateStr);
          matchStat = d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
        } else if (statFilter === 'starred') {
          matchStat = starredIds.indexOf(g.id) !== -1;
        } else if (statFilter === 'hot') {
          matchStat = g.hot === true;
        }
        var matchStudio = studioView === 'all' || (studioView === 'starred' && starredIds.indexOf(g.id) !== -1);
        return matchPlatform && matchGenre && matchSearch && matchStat && matchStudio;
      });
    }

    function sortGames(list) {

        if (currentSort === 'name-asc') return a.name.localeCompare(b.name, 'zh');
        if (currentSort === 'hot') return (b.hot ? 1 : 0) - (a.hot ? 1 : 0) || a.date.localeCompare(b.date);
        if (currentSort === 'heat-desc') return (b.heatLevel || 0) - (a.heatLevel || 0) || a.date.localeCompare(b.date);

        '</div></div>';

      if (g.officialUrl) {
        bodyHtml += '<div class="modal-section"><h3>官方链接</h3>' +
          '<a href="' + g.officialUrl + '" target="_blank" rel="noopener" class="official-link">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>' +
            '访问 Steam 商店页面 / 官方页面' +
          '</a>' +
        '</div>';
      }

      if (g.topicAngles && g.topicAngles.length > 0) {
        bodyHtml += '<div class="modal-section"><div class="topic-checklist"><h4>&#128221; 选题角度建议</h4>' +
          g.topicAngles.map(function(angle, idx) {
            var checked = isTopicSelected(g.id, idx);
            return '<div class="checklist-item">' +
              '<input type="checkbox" id="topic-' + g.id + '-' + idx + '"' + (checked ? ' checked' : '') +
              ' onchange="toggleTopic(' + g.id + ',' + idx + ');this.parentElement.style.opacity=this.checked?1:0.6">' +
              '<label for="topic-' + g.id + '-' + idx + '" style="cursor:pointer;' + (checked ? '' : 'opacity:0.6') + '">' + angle + '</label>' +
            '</div>';
          }).join('') +
        '</div></div>';
      }

      // News Section
      var newsList = gameNews[g.id] || [];
      if (newsList.length > 0) {
        bodyHtml += '<div class="modal-section news-section"><h3>&#128240; 相关资讯 (' + newsList.length + ')</h3><div class="news-list">' +
          newsList.map(function(n) {
            return '<div class="news-item"><span class="news-dot"></span><div>' +
              '<a href="' + n.url + '" target="_blank" rel="noopener" class="news-title">' + n.title + '</a>' +
              '<div class="news-source">' + n.source + ' · ' + n.date + '</div>' +
            '</div></div>';
          }).join('') +
        '</div></div>';
      } else {
        bodyHtml += '<div class="modal-section news-section"><h3>&#128240; 相关资讯</h3><div class="news-empty">暂无相关资讯</div></div>';
      }

      // Video Section
      var videos = getGameVideos(g.id);
      var hasV = videos.length > 0;
      bodyHtml += '<div class="modal-section video-section"><h3>&#127909; 视频产出</h3>';
      if (hasV) {
        bodyHtml += '<div class="video-list">' +
          videos.map(function(v, idx) {
            return '<div class="video-list-item">' +
              '<span class="video-plat">' + v.platform + '</span>' +
              '<a href="' + v.url + '" target="_blank" rel="noopener">' + (v.title || '视频链接') + '</a>' +
              '<button class="btn-del" onclick="event.stopPropagation();removeVideo(' + g.id + ',' + idx + ')">&#10005;</button>' +
            '</div>';
          }).join('') +
        '</div>';
      }
      bodyHtml += '<div class="video-form" style="margin-top:' + (hasV ? '0.6rem' : '0') + '">' +
        '<input type="text" id="video-url-' + g.id + '" placeholder="粘贴视频链接 (B站/YouTube/抖音等)" onkeydown="if(event.key===\'Enter\')addVideoFromModal(' + g.id + ')">' +
        '<input type="text" id="video-title-' + g.id + '" placeholder="视频标题（可选）" onkeydown="if(event.key===\'Enter\')addVideoFromModal(' + g.id + ')">' +
        '<button class="btn-save" onclick="addVideoFromModal(' + g.id + ')">&#43; 添加视频</button>' +
      '</div></div>';

      document.getElementById('modal-body').innerHTML = bodyHtml;
      document.getElementById('modal-overlay').classList.add('active');
    };

    // === Event Listeners ===
    document.getElementById('modal-overlay').addEventListener('click', function(e) {
      if (e.target === this) this.classList.remove('active');
    });
    document.getElementById('modal-close').addEventListener('click', function() {
      document.getElementById('modal-overlay').classList.remove('active');
    });

    // Modal star button
    document.getElementById('modal-star-btn').addEventListener('click', function(e) {
      e.stopPropagation();
      if (currentModalGameId !== null) {
        toggleStar(currentModalGameId);
        updateModalStarBtn(currentModalGameId);
      }
    });

    // Stat card clicks
    document.querySelectorAll('.stat-card').forEach(function(card) {
      card.addEventListener('click', function() {
        setStatFilter(this.dataset.action);
      });
    });

    // Clear stat filter
    document.getElementById('active-filter-clear').addEventListener('click', function(e) {
      e.stopPropagation();
      clearStatFilter();
    });

    document.getElementById('search-input').addEventListener('input', function() {
      searchQuery = this.value;
      refresh();
    });

    document.getElementById('platform-filters').addEventListener('click', function(e) {
      var btn = e.target.closest('.filter-btn');
      if (!btn) return;
      this.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      currentPlatform = btn.dataset.filter;
      refresh();
    });

    document.getElementById('genre-filters').addEventListener('click', function(e) {
      var btn = e.target.closest('.filter-btn');
      if (!btn) return;
      this.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      currentGenre = btn.dataset.genre;
      refresh();
    });

    document.getElementById('sort-select').addEventListener('change', function() {
      currentSort = this.value;
      refresh();
    });

    document.querySelectorAll('.view-toggle button').forEach(function(btn) {
      btn.addEventListener('click', function() {
        switchView(this.dataset.view);
      });
    });


    window.addVideoFromModal = function(gameId) {
      var url = document.getElementById('video-url-' + gameId).value;
      var title = document.getElementById('video-title-' + gameId).value;
      if (!url.trim()) { showToast('请输入视频链接'); return; }
      addVideo(gameId, url, title);
    };

    // Make functions global
    window.toggleStar = toggleStar;
    window.isTopicSelected = isTopicSelected;
    window.coverError = coverError;
    window.hasVideo = hasVideo;

    // Keyboard shortcut
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        document.getElementById('modal-overlay').classList.remove('active');
      }
    });

    // === Sync games data to localStorage for video-dashboard ===
    try {
      localStorage.setItem('games', JSON.stringify(games.map(function(g) {
        return {
          id: g.id, name: g.name, date: g.date, genres: g.genres,
          coverUrl: g.coverUrl || null, officialUrl: g.officialUrl || null, emoji: g.emoji || null
        };
      })));
    } catch(e) {}

    // === Init ===
    updateStats();
    refresh();
  })();
  </script>
</body>
</html>
