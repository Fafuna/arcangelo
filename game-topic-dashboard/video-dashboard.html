  <script>
  (function() {
    'use strict';

    // === Load Data ===
    var games = JSON.parse(localStorage.getItem('games') || '[]');
    var gameVideos = JSON.parse(localStorage.getItem('game-videos') || '{}');
    var videoStats = JSON.parse(localStorage.getItem('video-stats') || '{}');
    var starredIds = JSON.parse(localStorage.getItem('game-stars') || '[]');

    // Game lookup map
    var gameMap = {};
    games.forEach(function(g) { gameMap[g.id] = g; });
    // Starred set for quick lookup
    var starredSet = {};
    starredIds.forEach(function(id) { starredSet[id] = true; });

    // === Populate game select dropdown ===
    function populateGameSelect() {
      var sel = document.getElementById('new-video-game');
      if (!sel) return;
      var currentVal = sel.value;
      var html = '<option value="0">未关联</option>';

      // Group 1: starred games
      var starredGames = games.filter(function(g) { return starredSet[g.id]; });
      if (starredGames.length > 0) {
        html += '<optgroup label="&#9733; 已关注 (' + starredGames.length + ')">';
        starredGames.forEach(function(g) {
          var label = g.name + ' (' + g.date + ')';
          html += '<option value="' + g.id + '">' + label + '</option>';
        });
        html += '</optgroup>';
      }

      // Group 2: all other games
      var otherGames = games.filter(function(g) { return !starredSet[g.id]; });
      if (otherGames.length > 0) {
        html += '<optgroup label="全部游戏 (' + otherGames.length + ')">';
        otherGames.forEach(function(g) {
          var label = g.name + ' (' + g.date + ')';
          html += '<option value="' + g.id + '">' + label + '</option>';
        });
        html += '</optgroup>';
      }

      sel.innerHTML = html;
      // Restore selection if still valid
      if (currentVal && currentVal !== '0') {
        var opt = sel.querySelector('option[value="' + currentVal + '"]');
        if (opt) sel.value = currentVal;
      }
    }

    // Build flat video list
    function buildVideoList() {
      var list = [];
      Object.keys(gameVideos).forEach(function(gameId) {
        var gid = parseInt(gameId);
        var g = gameMap[gid];
        gameVideos[gameId].forEach(function(v, idx) {
          var key = gid + '_' + idx;
          var stats = videoStats[key] || {};
          list.push({
            key: key,
            gameId: gid,
            game: g,
            video: v,
            videoIdx: idx,
            views: stats.views || 0,
            likes: stats.likes || 0,
            comments: stats.comments || 0,
            shares: stats.shares || 0,
            coins: stats.coins || 0,
            favorites: stats.favorites || 0,
            danmaku: stats.danmaku || 0,
            syncedAt: stats.syncedAt || null,
            note: stats.note || ''
          });
        });
      });
      return list;
    }

    var allVideos = buildVideoList();

    // === Helpers ===
    function fmtNum(n) {
      if (!n) return '0';
      if (n >= 10000) return (n / 10000).toFixed(1) + 'w';
      if (n >= 1000) return (n / 1000).toFixed(1) + 'k';
      return n.toString();
    }
    function fmtFullNum(n) {
      if (!n) return '0';
      return n.toLocaleString();
    }
    function calcRate(views, likes) {
      if (!views || !likes) return '0.0%';
      return ((likes / views) * 100).toFixed(1) + '%';
    }
    function getRateClass(rateStr) {
      var v = parseFloat(rateStr);
      if (v >= 5) return 'high';
      if (v >= 2) return 'mid';
      return 'low';
    }
    function getCoverUrl(g) {
      if (!g) return null;
      if (g.coverUrl) return g.coverUrl;
      if (g.officialUrl && g.officialUrl.indexOf('store.steampowered.com/app/') !== -1) {
        var match = g.officialUrl.match(/app\/(\d+)/);
        if (match) return 'https://cdn.akamai.steamstatic.com/steam/apps/' + match[1] + '/capsule_616x353.jpg';
      }
      return null;
    }
    function getPlatformClass(platform) {
      if (platform === 'B站') return 'bili';
      if (platform === 'YouTube') return 'youtube';
      if (platform === '抖音') return 'douyin';
      if (platform === '小红书') return 'xhs';
      return 'other';
    }
    function detectPlatform(url) {
      if (url.indexOf('bilibili.com') !== -1 || url.indexOf('b23.tv') !== -1) return 'B站';
      if (url.indexOf('youtube.com') !== -1 || url.indexOf('youtu.be') !== -1) return 'YouTube';
      if (url.indexOf('douyin.com') !== -1) return '抖音';
      if (url.indexOf('xiaohongshu.com') !== -1) return '小红书';
      return '其他';
    }

    // === Save games data (merge with existing to preserve all fields) ===
    function saveGameVideos() {
      localStorage.setItem('game-videos', JSON.stringify(gameVideos));
    }
    function saveVideoStats() {
      localStorage.setItem('video-stats', JSON.stringify(videoStats));
    }

    // === Render Stats ===
    function renderStats() {
      var totalVideos = allVideos.length;
      var totalViews = 0, totalLikes = 0, totalComments = 0, totalShares = 0;
      allVideos.forEach(function(v) {
        totalViews += v.views || 0;
        totalLikes += v.likes || 0;
        totalComments += v.comments || 0;
        totalShares += v.shares || 0;
      });
      var avgRate = totalViews ? ((totalLikes / totalViews) * 100).toFixed(1) + '%' : '0.0%';
      var syncedCount = allVideos.filter(function(v) { return v.syncedAt; }).length;

      var html = '';
      html += '<div class="stat-tile"><div class="stat-tile-header"><span class="icon">&#127909;</span>视频总数</div><div class="stat-tile-value">' + totalVideos + '</div></div>';
      html += '<div class="stat-tile"><div class="stat-tile-header"><span class="icon">&#128064;</span>总播放量</div><div class="stat-tile-value">' + fmtNum(totalViews) + '</div></div>';
      html += '<div class="stat-tile"><div class="stat-tile-header"><span class="icon">&#128077;</span>总点赞</div><div class="stat-tile-value">' + fmtNum(totalLikes) + '</div></div>';
      html += '<div class="stat-tile"><div class="stat-tile-header"><span class="icon">&#128172;</span>总评论</div><div class="stat-tile-value">' + fmtNum(totalComments) + '</div></div>';
      html += '<div class="stat-tile"><div class="stat-tile-header"><span class="icon">&#128260;</span>总分享</div><div class="stat-tile-value">' + fmtNum(totalShares) + '</div></div>';
      html += '<div class="stat-tile"><div class="stat-tile-header"><span class="icon">&#128200;</span>平均点赞率</div><div class="stat-tile-value">' + avgRate + '</div></div>';
      html += '<div class="stat-tile"><div class="stat-tile-header"><span class="icon">&#9989;</span>已同步</div><div class="stat-tile-value" style="font-size:1.3rem;color:var(--accent2);">' + syncedCount + '/' + totalVideos + '</div></div>';
      document.getElementById('stats-grid').innerHTML = html;

    // === Render Platform Chart ===
    function renderPlatformChart() {
      var platCounts = {};
      allVideos.forEach(function(v) {
        var p = v.video.platform || '其他';
        platCounts[p] = (platCounts[p] || 0) + 1;
      });
      var labels = Object.keys(platCounts);
      if (labels.length === 0) {
        document.getElementById('platform-chart').innerHTML = '<div class="empty-state"><p>暂无视频数据</p></div>';
        return;
      }
      var maxCount = Math.max.apply(null, Object.values(platCounts));
      var colors = {
        'B站': '#00a1d6',
        'YouTube': '#ff0000',
        '抖音': '#000000',
        '小红书': '#ff2442',
        '其他': '#6c5ce7'
      };
      var html = '';
      labels.forEach(function(label) {
        var count = platCounts[label];
        var pct = (count / maxCount * 100);
        var color = colors[label] || '#6c5ce7';
        html += '<div class="bar-item">' +
          '<div class="bar-value">' + count + '</div>' +
          '<div class="bar-fill" style="height:' + Math.max(pct, 4) + 'px;background:' + color + ';"></div>' +
          '<div class="bar-label">' + label + '</div>' +

      });

    // === Edit Actions ===
    window.startEdit = function(key) {
      editingKey = key;
      renderTable();
      setTimeout(function() {
        var input = document.getElementById('edit-views-' + key);
        if (input) input.focus();
      }, 50);
    };
    window.cancelEdit = function() {
      editingKey = null;
      renderTable();
    };
    window.saveRow = function(key) {
      var views = parseInt(document.getElementById('edit-views-' + key).value) || 0;
      var likes = parseInt(document.getElementById('edit-likes-' + key).value) || 0;
      var comments = parseInt(document.getElementById('edit-comments-' + key).value) || 0;
      var shares = parseInt(document.getElementById('edit-shares-' + key).value) || 0;
      var titleInput = document.getElementById('edit-title-' + key);
      var newTitle = titleInput ? titleInput.value.trim() : '';

      // Preserve existing stats fields
      var existing = videoStats[key] || {};
      videoStats[key] = {
        views: views,
        likes: likes,
        comments: comments,
        shares: shares,
        coins: existing.coins || 0,
        favorites: existing.favorites || 0,
        danmaku: existing.danmaku || 0,
        syncedAt: existing.syncedAt || null,
        updatedAt: new Date().toISOString()
      };
      saveVideoStats();

      // Update title in gameVideos if changed
      var parts = key.split('_');
      var gid = parseInt(parts[0]);
      var idx = parseInt(parts[1]);
      if (gameVideos[gid] && gameVideos[gid][idx]) {
        if (newTitle && gameVideos[gid][idx].title !== newTitle) {
          gameVideos[gid][idx].title = newTitle;
          saveGameVideos();
        }
      }

      // Update local array
      var item = allVideos.find(function(v) { return v.key === key; });
      if (item) {
        item.views = views;
        item.likes = likes;
        item.comments = comments;
        item.shares = shares;
        if (newTitle) item.video.title = newTitle;
      }

      editingKey = null;
      renderTable();
      renderStats();
      renderPlatformChart();
      showToast('数据已保存');
    };

    // === Remove Video ===
    window.removeVideoEntry = function(key) {
      if (!confirm('确定删除这条视频记录吗？')) return;
      var parts = key.split('_');
      var gid = parseInt(parts[0]);
      var idx = parseInt(parts[1]);
      if (gameVideos[gid]) {
        gameVideos[gid].splice(idx, 1);
        if (gameVideos[gid].length === 0) delete gameVideos[gid];
        saveGameVideos();
      }
      delete videoStats[key];
      saveVideoStats();

      // Rebuild
      allVideos = buildVideoList();
      renderTable();
      renderStats();
      renderPlatformChart();
      showToast('视频已删除');
    };

    // === Add New Video ===
    window.addNewVideo = function() {
      var urlEl = document.getElementById('new-video-url');
      var titleEl = document.getElementById('new-video-title');
      var gameSel = document.getElementById('new-video-game');
      var url = urlEl.value.trim();
      var title = titleEl.value.trim();
      var gameId = parseInt(gameSel.value) || 0;

      if (!url) {
        showToast('请填写视频链接', 'warn');
        urlEl.focus();
        return;
      }

      var platform = detectPlatform(url);
      var videoData = {
        url: url,
        title: title || '获取中...',
        platform: platform,
        date: new Date().toISOString().slice(0, 10)
      };

      // Use gameId as string key (0 for unlinked)
      var gidStr = String(gameId);
      if (!gameVideos[gidStr]) gameVideos[gidStr] = [];
      gameVideos[gidStr].push(videoData);
      saveGameVideos();

      // Clear inputs
      urlEl.value = '';
      titleEl.value = '';
      gameSel.value = '0';

      // Rebuild list
      allVideos = buildVideoList();
      renderTable();
      renderStats();
      renderPlatformChart();

      var gameName = gameId > 0 && gameMap[gameId] ? gameMap[gameId].name : '';
      showToast('视频已添加' + (gameName ? ' · 关联: ' + gameName : '') + (platform === 'B站' ? '，正在获取数据...' : '，正在获取标题...'));

      // Auto-fetch title and data
      var newItem = allVideos[allVideos.length - 1];
      if (newItem) {
        fetchVideoInfo(newItem.key);
      }
    };

    // === Toast ===
    function showToast(message, type) {
      var container = document.getElementById('toast-container');
      var toast = document.createElement('div');
      toast.className = 'toast' + (type ? ' ' + type : '');
      var icon = type === 'error' ? '&#10060;' : type === 'warn' ? '&#9888;' : '&#9989;';
      toast.innerHTML = '<span class="toast-icon">' + icon + '</span>' + message;
      container.appendChild(toast);
      requestAnimationFrame(function() { toast.classList.add('show'); });
      setTimeout(function() {
        toast.classList.remove('show');
        setTimeout(function() { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 350);
      }, 3000);
    }
    window.showToast = showToast;

    // === B站 BV号提取 ===
    function extractBvid(url) {
      var match = url.match(/\/video\/(BV[\w]+)/);
      if (match) return match[1];
      match = url.match(/bvid=(BV[\w]+)/);
      if (match) return match[1];
      match = url.match(/(BV[\w]{10})/);
      if (match) return match[1];
      return null;
    }

    // === 通过CORS代理获取视频标题（通用，支持多平台）===
    function fetchVideoTitle(url, platform, callback) {
      if (platform === 'B站') {
        // B站用API获取，同时返回标题和统计数据
        var bvid = extractBvid(url);
        if (!bvid) { callback(null, 'no_bvid'); return; }
        fetchBiliStats(bvid, function(data, err) {
          if (err || !data || data.code !== 0) { callback(null, 'api_failed'); return; }
          callback({title: data.data.title, stat: data.data}, null);
        });
      } else if (platform === 'YouTube') {
        // YouTube: 从 oEmbed API 获取标题
        var ytMatch = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([\w-]{11})/);
        if (!ytMatch) { callback(null, 'no_yt_id'); return; }
        var oembedUrl = 'https://www.youtube.com/oembed?url=' + encodeURIComponent('https://www.youtube.com/watch?v=' + ytMatch[1]) + '&format=json';
        fetchViaProxy(oembedUrl, function(text) {
          if (!text) { callback(null, 'proxy_failed'); return; }
          try {
            var d = JSON.parse(text);
            callback({title: d.title, stat: null}, null);
          } catch(e) { callback(null, 'parse_error'); }
        });
      } else {
        // 其他平台：通过代理获取页面 HTML，提取 <title>
        fetchViaProxy(url, function(text) {
          if (!text) { callback(null, 'proxy_failed'); return; }
          var titleMatch = text.match(/<title[^>]*>([^<]+)<\/title>/i);
          if (titleMatch) {
            var t = titleMatch[1].trim().replace(/&#\d+;/g, '').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>');
            // 清理常见后缀
            t = t.replace(/\s*[-|–—]\s*(哔哩哔哩|bilibili|抖音|小红书|YouTube).*$/i, '').trim();
            if (t.length > 100) t = t.substring(0, 100) + '...';
            callback({title: t, stat: null}, null);
          } else {
            callback(null, 'no_title');
          }
        });
      }
    }

    // === 通用代理请求 ===
    function fetchViaProxy(targetUrl, callback) {
      var proxyIdx = 0;
      function tryProxy() {
        if (proxyIdx >= CORS_PROXIES.length) { callback(null); return; }
        var proxyUrl = CORS_PROXIES[proxyIdx] + encodeURIComponent(targetUrl);
        var xhr = new XMLHttpRequest();
        xhr.open('GET', proxyUrl, true);
        xhr.timeout = 15000;
        xhr.onload = function() {
          if (xhr.status === 200 && xhr.responseText) {
            callback(xhr.responseText);
          } else {
            proxyIdx++;
            tryProxy();
          }
        };
        xhr.onerror = function() { proxyIdx++; tryProxy(); };
        xhr.ontimeout = function() { proxyIdx++; tryProxy(); };
        xhr.send();
      }
      tryProxy();
    }

    // === 统一获取视频信息（标题+数据）===
    window.fetchVideoInfo = function(key) {
      var item = allVideos.find(function(v) { return v.key === key; });
      if (!item) return;

      // Update sync badge to syncing
      var syncEl = document.querySelector('[data-key="' + key + '"] .sync-indicator');
      if (syncEl) {
        syncEl.className = 'sync-indicator syncing';
        syncEl.innerHTML = '&#128260; 获取中...';
      }

      fetchVideoTitle(item.video.url, item.video.platform, function(result, err) {
        if (err || !result) {
          if (syncEl) {
            syncEl.className = 'sync-indicator pending';
            syncEl.innerHTML = '&#9888; 待同步';
          }
          // Set a fallback title if still placeholder
          if (item.video.title === '获取中...') {
            updateVideoTitle(key, item.video.url);
          }
          if (item.video.platform === 'B站') {
            showToast('B站数据获取失败，可手动填写', 'error');
          } else {
            showToast('标题自动获取失败，可手动编辑', 'warn');
          }
          return;
        }

        // Update title
        if (result.title) {
          updateVideoTitle(key, result.title);
        }

        // Update stats if available (B站)
        if (result.stat) {
          var stat = result.stat;
          videoStats[key] = {
            views: stat.view || 0,
            likes: stat.like || 0,
            comments: stat.reply || 0,
            shares: stat.share || 0,
            coins: stat.coin || 0,
            favorites: stat.favorite || 0,
            danmaku: stat.danmaku || 0,
            syncedAt: new Date().toISOString()
          };
          saveVideoStats();

          item.views = stat.view || 0;
          item.likes = stat.like || 0;
          item.comments = stat.reply || 0;
          item.shares = stat.share || 0;
          item.syncedAt = videoStats[key].syncedAt;
        }

        renderTable();
        renderStats();
        renderPlatformChart();

        if (result.stat) {
          showToast('已获取: ' + (result.title || '视频') + ' · 播放' + fmtNum(stat.view || 0));
        } else {
          showToast('已获取标题: ' + (result.title || '未知'));
        }
      });
    };

    // === 更新视频标题 ===
    function updateVideoTitle(key, newTitle) {
      var parts = key.split('_');
      var gid = parseInt(parts[0]);
      var idx = parseInt(parts[1]);
      if (gameVideos[gid] && gameVideos[gid][idx]) {
        gameVideos[gid][idx].title = newTitle;
        saveGameVideos();
      }
      var item = allVideos.find(function(v) { return v.key === key; });
      if (item) item.video.title = newTitle;
    }

    // === 通过CORS代理获取B站视频数据 ===
    var CORS_PROXIES = [
      'https://corsproxy.io/?url=',
      'https://api.allorigins.win/raw?url=',
      'https://api.codetabs.com/v1/proxy/?quest=',
      'https://thingproxy.freeboard.io/fetch/'
    ];

    function fetchBiliStats(bvid, callback) {
      var apiTarget = 'https://api.bilibili.com/x/web-interface/view?bvid=' + bvid;
      var proxyIdx = 0;
      var results = [];

      function tryProxy() {
        if (proxyIdx >= CORS_PROXIES.length) {
          callback(null, 'all_proxies_failed');
          return;
        }
        var proxyUrl;
        if (CORS_PROXIES[proxyIdx].indexOf('codetabs') !== -1) {
          proxyUrl = CORS_PROXIES[proxyIdx] + encodeURIComponent(apiTarget);
        } else if (CORS_PROXIES[proxyIdx].indexOf('allorigins') !== -1) {
          proxyUrl = CORS_PROXIES[proxyIdx] + encodeURIComponent(apiTarget);
        } else {
          proxyUrl = CORS_PROXIES[proxyIdx] + encodeURIComponent(apiTarget);
        }

        var xhr = new XMLHttpRequest();
        xhr.open('GET', proxyUrl, true);
        xhr.timeout = 15000;
        xhr.onload = function() {
          if (xhr.status === 200 && xhr.responseText) {
            try {
              var data = JSON.parse(xhr.responseText);
              if (data && data.code === 0 && data.data) {
                callback(data, null);
                return;
              }
            } catch(e) {
              results.push('proxy' + proxyIdx + ': parse_error');
            }
          }
          proxyIdx++;
          tryProxy();
        };
        xhr.onerror = function() {
          results.push('proxy' + proxyIdx + ': network_error');
          proxyIdx++;
          tryProxy();
        };
        xhr.ontimeout = function() {
          results.push('proxy' + proxyIdx + ': timeout');
          proxyIdx++;
          tryProxy();
        };
        xhr.send();
      }
      tryProxy();
    }

    // === 同步单个视频（改为调用统一获取函数）===
    window.syncOne = function(key) {
      var item = allVideos.find(function(v) { return v.key === key; });
      if (!item) return;
      fetchVideoInfo(key);
    };

    // === 同步所有视频数据（支持多平台标题获取）===
    window.syncAllStats = function() {
      var allItems = allVideos.slice();
      if (allItems.length === 0) {
        showToast('没有视频可同步', 'warn');
        return;
      }

      var btn = document.getElementById('sync-btn');
      var statusEl = document.getElementById('sync-status');
      btn.disabled = true;
      btn.textContent = '同步中...';
      statusEl.style.display = 'block';
      statusEl.textContent = '正在获取视频数据 (0/' + allItems.length + ')...';

      var completed = 0;
      var success = 0;
      var failed = 0;
      var total = allItems.length;

      allItems.forEach(function(item, i) {
        // Stagger requests to avoid rate limiting
        setTimeout(function() {
          // Update badge
          var syncEl = document.querySelector('[data-key="' + item.key + '"] .sync-indicator');
          if (syncEl) {
            syncEl.className = 'sync-indicator syncing';
            syncEl.innerHTML = '&#128260; 获取中...';
          }

          fetchVideoTitle(item.video.url, item.video.platform, function(result, err) {
            completed++;
            if (err || !result) {
              failed++;
              if (syncEl) {
                syncEl.className = 'sync-indicator pending';
                syncEl.innerHTML = '&#9888; 失败';
              }
              // Fallback: use URL as title if still placeholder
              if (item.video.title === '获取中...' || item.video.title === '未命名视频') {
                updateVideoTitle(item.key, '视频链接');
              }
            } else {
              // Update title
              if (result.title) {
                updateVideoTitle(item.key, result.title);
              }
              // Update stats if available
              if (result.stat) {
                var stat = result.stat;
                videoStats[item.key] = {
                  views: stat.view || 0,
                  likes: stat.like || 0,
                  comments: stat.reply || 0,
                  shares: stat.share || 0,
                  coins: stat.coin || 0,
                  favorites: stat.favorite || 0,
                  danmaku: stat.danmaku || 0,
                  syncedAt: new Date().toISOString()
                };
                item.views = stat.view || 0;
                item.likes = stat.like || 0;
                item.comments = stat.reply || 0;
                item.shares = stat.share || 0;
                item.syncedAt = videoStats[item.key].syncedAt;
              }
              success++;
            }
            checkDone();
          });
        }, i * 800);
      });

      function checkDone() {
        statusEl.textContent = '正在获取... (' + completed + '/' + total + ')';
        if (completed >= total) {
          saveVideoStats();
          saveGameVideos();
          renderTable();
          renderStats();
          renderPlatformChart();
          btn.disabled = false;
          btn.innerHTML = '&#128260; 同步数据';
          if (success > 0) {
            statusEl.innerHTML = '&#9989; 同步完成: 成功 ' + success + ' 个' + (failed > 0 ? ', 失败 ' + failed + ' 个' : '') + ' · ' + new Date().toLocaleTimeString('zh-CN');
            showToast('已同步 ' + success + ' 个视频');
          } else {
            statusEl.innerHTML = '&#9888; 同步失败: 跨域代理不可用。可手动填写数据，或稍后重试。';
            showToast('同步失败，请手动填写', 'error');
          }
        }
      }
    };

    // === Init ===
    populateGameSelect();
    renderStats();
    renderPlatformChart();
    renderTable();
  })();
  </script>
</body>
</html>
