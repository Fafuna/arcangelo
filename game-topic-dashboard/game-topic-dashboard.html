      container.style.display = 'block';

      list.forEach(function(g) {
        if (!groups[g.date]) groups[g.date] = [];
        groups[g.date].push(g);
      });

      var sortedDates = Object.keys(groups).sort();
      var colorMap = { 'high': '#d63031', 'medium': '#e17055', 'low': '#00b894' };

      container.innerHTML = sortedDates.map(function(date) {
        var items = groups[date];
        return '<div class="timeline-group">' +
          '<div class="timeline-date">' + date + ' <span class="count">' + items.length + '款</span></div>' +
          '<div class="timeline-items">' +
            items.map(function(g) {
              var starred = isStarred(g.id);
              var heatStars = [1,2,3,4,5].map(function(n) {
                return '<span class="heat-star' + (n <= g.heatLevel ? '' : ' empty') + '">&#9733;</span>';
              }).join('');
              return '<div class="timeline-item">' +
                '<div class="timeline-dot" style="background:' + colorMap[g.priority] + '"></div>' +
                '<div class="timeline-info" onclick="openModal(' + g.id + ')" style="cursor:pointer;">' +
                  '<div class="timeline-title">' +
                    '<span class="name">' + g.name + '</span>' +
                    (g.hot ? '<span title="重点推荐">&#128293;</span>' : '') +
                  '</div>' +
                  '<div class="timeline-sub">' + g.nameEn + ' · ' + g.developer + '</div>' +
                '</div>' +
                '<div class="timeline-heat" title="搜索热度 ' + g.heatLevel + '/5">' +
                  heatStars +
                  '<span class="heat-text">' + g.heatLevel + '</span>' +
                '</div>' +
                '<button class="star-btn' + (starred ? ' active' : '') + '" onclick="event.stopPropagation();toggleStar(' + g.id + ')" title="' + (starred ? '取消关注' : '标记关注') + '">' +
                  (starred ? '&#9733;' : '&#9734;') +
                '</button>' +
                '<div class="timeline-tags" onclick="openModal(' + g.id + ')" style="cursor:pointer;">' +
                  g.genres.slice(0, 2).map(function(genre) {
                    return '<span class="tag tag-genre">' + genre + '</span>';
                  }).join('') +
                '</div>' +
              '</div>';
            }).join('') +
          '</div>' +
        '</div>';
      }).join('');
    }

    // === Update Stats ===
    function updateStats() {
      document.getElementById('stat-total').textContent = games.length;
      document.getElementById('stat-starred').textContent = starredIds.length;
      document.getElementById('stat-videos').textContent = getVideoCount();
      var now = new Date();
      var thisMonth = games.filter(function(g) {
        var dateStr = g.date.substring(0, 10);
        var d = new Date(dateStr);
        return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
      });
      document.getElementById('stat-month').textContent = thisMonth.length;
      var hotCount = games.filter(function(g) { return g.hot; }).length;
      document.getElementById('stat-hot').textContent = hotCount;
    }

    // === Toast ===
    function showToast(message) {
      var container = document.getElementById('toast-container');
      var toast = document.createElement('div');
      toast.className = 'toast';
      toast.innerHTML = '<span class="toast-icon">&#9989;</span>' + message;
      container.appendChild(toast);
      requestAnimationFrame(function() {
        toast.classList.add('show');
      });
      setTimeout(function() {
        toast.classList.remove('show');
        setTimeout(function() { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 350);
      }, 2200);
    }

    // === Stat Card Filter ===
    function setStatFilter(action) {
      var labelMap = {
        'all': '全部游戏',
        'month': '本月待发布',
        'starred': '已标记关注',
        'hot': '重点推荐'
      };
      // toggle off if same clicked
      if (statFilter === action) {
        statFilter = null;
        document.querySelectorAll('.stat-card').forEach(function(c) { c.classList.remove('active'); });
        document.getElementById('active-filter-label').style.display = 'none';
      } else {
        statFilter = action;
        document.querySelectorAll('.stat-card').forEach(function(c) { c.classList.remove('active'); });
        var activeBtn = document.querySelector('.stat-card[data-action="' + action + '"]');
        if (activeBtn) activeBtn.classList.add('active');
        document.getElementById('active-filter-text').textContent = labelMap[action];
        document.getElementById('active-filter-label').style.display = 'block';
      }
      refresh();
    }

    function clearStatFilter() {
      statFilter = null;
      document.querySelectorAll('.stat-card').forEach(function(c) { c.classList.remove('active'); });
      document.getElementById('active-filter-label').style.display = 'none';
      refresh();
    }

    // === Switch View ===
    function switchView(view) {
      currentView = view;
      var grid = document.getElementById('game-grid');
      var timeline = document.getElementById('timeline-view');
      var empty = document.getElementById('empty-state');

      document.querySelectorAll('.view-toggle button').forEach(function(b) {
        b.classList.toggle('active', b.dataset.view === view);
      });

      if (view === 'grid') {
        grid.classList.add('active');
        grid.style.display = '';
        timeline.classList.remove('active');
        timeline.style.display = 'none';
      } else {
        grid.classList.remove('active');
        grid.style.display = 'none';
        timeline.classList.add('active');
        timeline.style.display = 'block';
      }

      // 如果当前筛选结果为空，确保 empty-state 显示在正确的视图中
      var filtered = filterGames();
      if (filtered.length === 0) {
        empty.classList.add('active');
        grid.style.display = 'none';
        timeline.style.display = 'none';
      } else {
        empty.classList.remove('active');
      }
    }

    // === Studio View ===
    var studioView = 'all';
    window.switchStudioView = function(view) {
      studioView = view;
      document.querySelectorAll('.studio-bar button').forEach(function(btn) {
        btn.classList.toggle('active', btn.getAttribute('data-view') === view);
      });
      refresh();
    };

    // === Refresh ===
    function refresh() {
      var filtered = sortGames(filterGames());
      renderGrid(filtered);
      renderTimeline(filtered);
      // 确保当前视图状态正确
      switchView(currentView);
    }

    // === Modal ===
    var currentModalGameId = null;

    function updateModalStarBtn(id) {
      var btn = document.getElementById('modal-star-btn');
      var starred = isStarred(id);
      btn.innerHTML = starred ? '&#9733;' : '&#9734;';
      btn.className = starred ? 'star-btn active' : 'star-btn';
      btn.title = starred ? '取消关注' : '标记关注';
      btn.style.color = starred ? 'var(--accent4)' : 'var(--muted)';
      btn.style.borderColor = starred ? 'var(--accent4)' : 'var(--rule)';
    }

    window.openModal = function(id) {
      var g = games.find(function(x) { return x.id === id; });
      if (!g) return;
      currentModalGameId = id;
      document.getElementById('modal-title').textContent = g.name;
      document.getElementById('modal-title-en').textContent = g.nameEn;
      updateModalStarBtn(id);
      document.getElementById('modal-tags').innerHTML =
        '<span class="tag tag-date">' + g.date + '</span>' +
        g.genres.map(function(genre) { return '<span class="tag tag-genre">' + genre + '</span>'; }).join('') +
        g.platforms.map(function(p) { return '<span class="tag tag-platform">' + p + '</span>'; }).join('') +
        (g.chinese ? '<span class="tag tag-platform">&#127464;&#127475; 中文支持</span>' : '') +
        (g.hot ? '<span class="tag tag-hot">&#128293; 重点推荐</span>' : '') +
        '<span class="tag" style="background:rgba(' +
          (g.priority === 'high' ? '214,48,49' : g.priority === 'medium' ? '225,112,85' : '0,184,148') +
          ',0.15);color:' + (g.priority === 'high' ? '#d63031' : g.priority === 'medium' ? '#e17055' : '#00b894') +
        '">&#9679; ' + (g.priority === 'high' ? '高优先' : g.priority === 'medium' ? '中优先' : '低优先') + '</span>';

      var heatLabels = {1:'极低',2:'较低',3:'中等',4:'较高',5:'极高'};
      var heatBarsHtml = [1,2,3,4,5].map(function(n) {
        return '<span class="heat-bar' + (n <= g.heatLevel ? ' active' : '') + '" style="width:6px;height:18px;"></span>';
      }).join('');

      var bodyHtml = '<div class="modal-section"><h3>游戏简介</h3><div class="modal-desc">' + g.desc + '</div></div>' +
        '<div class="modal-section"><h3>搜索热度预估</h3>' +
          '<div class="modal-heat">' +
            '<span class="heat-rating">' + heatBarsHtml + '</span>' +
            '<span class="modal-heat-value">' + heatLabels[g.heatLevel] + ' (' + g.heatLevel + '/5)</span>' +
            '<span style="font-size:0.78rem;color:var(--muted);margin-left:auto;">基于IP影响力、Steam关注度、媒体讨论度综合评估</span>' +
          '</div>' +
        '</div>' +
        '<div class="modal-section"><h3>详细信息</h3><div class="modal-grid">' +
          '<div class="modal-field"><div class="modal-field-label">发售日期</div><div class="modal-field-value">' + g.date + '</div></div>' +
          '<div class="modal-field"><div class="modal-field-label">价格</div><div class="modal-field-value">' + g.price + '</div></div>' +
          '<div class="modal-field"><div class="modal-field-label">开发商</div><div class="modal-field-value">' + g.developer + '</div></div>' +
          '<div class="modal-field"><div class="modal-field-label">发行商</div><div class="modal-field-value">' + g.publisher + '</div></div>' +
        '</div></div>';

      if (g.officialUrl) {
        bodyHtml += '<div class="modal-section"><h3>官方链接</h3>' +
          '<a href="' + g.officialUrl + '" target="_blank" rel="noopener" class="official-link">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>' +
            '访问 Steam 商店页面 / 官方页面' +
          '</a>' +
        '</div>';
      }

      if (g.topicAngles && g.topicAngles.length > 0) {
        bodyHtml += '<div class="modal-section"><div class="topic-checklist"><h4>&#128221; 选题角度建议</h4>' +
          g.topicAngles.map(function(angle, idx) {
            var checked = isTopicSelected(g.id, idx);
            return '<div class="checklist-item">' +
              '<input type="checkbox" id="topic-' + g.id + '-' + idx + '"' + (checked ? ' checked' : '') +
              ' onchange="toggleTopic(' + g.id + ',' + idx + ');this.parentElement.style.opacity=this.checked?1:0.6">' +
              '<label for="topic-' + g.id + '-' + idx + '" style="cursor:pointer;' + (checked ? '' : 'opacity:0.6') + '">' + angle + '</label>' +
            '</div>';
          }).join('') +
        '</div></div>';
      }

      // News Section
      var newsList = gameNews[g.id] || [];
      if (newsList.length > 0) {
        bodyHtml += '<div class="modal-section news-section"><h3>&#128240; 相关资讯 (' + newsList.length + ')</h3><div class="news-list">' +
          newsList.map(function(n) {
            return '<div class="news-item"><span class="news-dot"></span><div>' +
              '<a href="' + n.url + '" target="_blank" rel="noopener" class="news-title">' + n.title + '</a>' +
              '<div class="news-source">' + n.source + ' · ' + n.date + '</div>' +
            '</div></div>';
          }).join('') +
        '</div></div>';
      } else {
        bodyHtml += '<div class="modal-section news-section"><h3>&#128240; 相关资讯</h3><div class="news-empty">暂无相关资讯</div></div>';
      }

      // Video Section
      var videos = getGameVideos(g.id);
      var hasV = videos.length > 0;
      bodyHtml += '<div class="modal-section video-section"><h3>&#127909; 视频产出</h3>';
      if (hasV) {
        bodyHtml += '<div class="video-list">' +
          videos.map(function(v, idx) {
            return '<div class="video-list-item">' +
              '<span class="video-plat">' + v.platform + '</span>' +
              '<a href="' + v.url + '" target="_blank" rel="noopener">' + (v.title || '视频链接') + '</a>' +
              '<button class="btn-del" onclick="event.stopPropagation();removeVideo(' + g.id + ',' + idx + ')">&#10005;</button>' +
            '</div>';
          }).join('') +
        '</div>';
      }
      bodyHtml += '<div class="video-form" style="margin-top:' + (hasV ? '0.6rem' : '0') + '">' +
        '<input type="text" id="video-url-' + g.id + '" placeholder="粘贴视频链接 (B站/YouTube/抖音等)" onkeydown="if(event.key===\'Enter\')addVideoFromModal(' + g.id + ')">' +
        '<input type="text" id="video-title-' + g.id + '" placeholder="视频标题（可选）" onkeydown="if(event.key===\'Enter\')addVideoFromModal(' + g.id + ')">' +
        '<button class="btn-save" onclick="addVideoFromModal(' + g.id + ')">&#43; 添加视频</button>' +
      '</div></div>';

      document.getElementById('modal-body').innerHTML = bodyHtml;
      document.getElementById('modal-overlay').classList.add('active');
    };

    // === Event Listeners ===
    document.getElementById('modal-overlay').addEventListener('click', function(e) {
      if (e.target === this) this.classList.remove('active');
    });
    document.getElementById('modal-close').addEventListener('click', function() {
      document.getElementById('modal-overlay').classList.remove('active');
    });

    // Modal star button
    document.getElementById('modal-star-btn').addEventListener('click', function(e) {
      e.stopPropagation();
      if (currentModalGameId !== null) {
        toggleStar(currentModalGameId);
        updateModalStarBtn(currentModalGameId);
      }
    });

    // Stat card clicks
    document.querySelectorAll('.stat-card').forEach(function(card) {
      card.addEventListener('click', function() {
        setStatFilter(this.dataset.action);
      });
    });

    // Clear stat filter
    document.getElementById('active-filter-clear').addEventListener('click', function(e) {
      e.stopPropagation();
      clearStatFilter();
    });

    document.getElementById('search-input').addEventListener('input', function() {
      searchQuery = this.value;
      refresh();
    });

    document.getElementById('platform-filters').addEventListener('click', function(e) {
      var btn = e.target.closest('.filter-btn');
      if (!btn) return;
      this.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      currentPlatform = btn.dataset.filter;
      refresh();
    });

    document.getElementById('genre-filters').addEventListener('click', function(e) {
      var btn = e.target.closest('.filter-btn');
      if (!btn) return;
      this.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      currentGenre = btn.dataset.genre;
      refresh();
    });

    document.getElementById('sort-select').addEventListener('change', function() {
      currentSort = this.value;
      refresh();
    });

    document.querySelectorAll('.view-toggle button').forEach(function(btn) {
      btn.addEventListener('click', function() {
        switchView(this.dataset.view);
      });
    });


    window.addVideoFromModal = function(gameId) {
      var url = document.getElementById('video-url-' + gameId).value;
      var title = document.getElementById('video-title-' + gameId).value;
      if (!url.trim()) { showToast('请输入视频链接'); return; }
      addVideo(gameId, url, title);
    };

    // Make functions global
    window.toggleStar = toggleStar;
    window.isTopicSelected = isTopicSelected;
    window.coverError = coverError;
    window.hasVideo = hasVideo;

    // Keyboard shortcut
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        document.getElementById('modal-overlay').classList.remove('active');
      }
    });

    // === Sync games data to localStorage for video-dashboard ===
    try {
      localStorage.setItem('games', JSON.stringify(games.map(function(g) {
        return {
          id: g.id, name: g.name, date: g.date, genres: g.genres,
          coverUrl: g.coverUrl || null, officialUrl: g.officialUrl || null, emoji: g.emoji || null
        };
      })));
    } catch(e) {}

    // === Init ===
    updateStats();
    refresh();
  })();
  </script>
</body>
</html>
